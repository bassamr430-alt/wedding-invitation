<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2520"/>
      <stop offset="40%" style="stop-color:#4a4035"/>
      <stop offset="100%" style="stop-color:#1a1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" style="stop-color:#C8A96A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#C8A96A;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Soft bokeh orbs -->
  <circle cx="300" cy="400" r="120" fill="#C8A96A" opacity="0.06" filter="url(#blur)"/>
  <circle cx="1600" cy="300" r="180" fill="#B08D57" opacity="0.05" filter="url(#blur)"/>
  <circle cx="960" cy="800" r="200" fill="#C8A96A" opacity="0.04" filter="url(#blur)"/>
  <!-- Elegant silhouette -->
  <ellipse cx="960" cy="950" rx="800" ry="80" fill="#0d0c0a" opacity="0.5"/>
  <path d="M760 900 Q960 750 1160 900" stroke="#C8A96A" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
